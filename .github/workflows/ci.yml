name: Verificar alpha
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: mvn -B package
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npx next typegen
        working-directory: apps/web
      - run: npm run check
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
      - run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/check-routes.mjs
      - run: node scripts/smoke.mjs

  arm-deployment:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Create disposable configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import secrets
          values = dict(line.split('=', 1) for line in Path('deploy/.env.example').read_text().splitlines() if line and not line.startswith('#'))
          for key in ('CATALOG_INTERNAL_SECRET', 'SOCIAL_INTERNAL_SECRET', 'NEXTAUTH_SECRET', 'CATALOG_DB_PASSWORD', 'SOCIAL_DB_PASSWORD'):
              values[key] = secrets.token_urlsafe(32)
          values.update(ALPHA_URL='https://alpha.example.test', TMDB_TOKEN='fake-ci-token', INVITED_EMAILS='guest@example.test', SMTP_HOST='smtp.example.test', SMTP_USERNAME='test-user', SMTP_PASSWORD=secrets.token_urlsafe(32), MAIL_FROM='sender@example.test')
          Path('deploy/.env').write_text(''.join(f'{key}={value}\n' for key, value in values.items()))
          PY
      - name: Build and start ARM containers
        run: python3 deploy/alpha.py up
      - name: Backup and isolated restore
        run: |
          python3 deploy/alpha.py backup
          python3 deploy/alpha.py restore-check "$(find backups -mindepth 1 -maxdepth 1 -type d | head -n 1)"
      - name: Stop disposable stack
        if: always()
        run: docker compose --env-file deploy/.env -f compose.yaml -f compose.alpha.yaml down -v
