name: cena-aberta-alpha
x-runtime: &runtime
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  backup:
    <<: *runtime
    build:
      context: ./deploy
      dockerfile: backup.Dockerfile
    volumes:
      - admin-backups:/archive
    environment:
      INTERNAL_SECRET: ${SOCIAL_INTERNAL_SECRET:?}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?}
      SOCIAL_DB_PASSWORD: ${SOCIAL_DB_PASSWORD:?}
      SMTP_HOST: ${SMTP_HOST:?}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?}
      MAIL_FROM: ${MAIL_FROM:?}
      ALPHA_URL: ${ALPHA_URL:?}
  catalog-db:
    <<: *runtime
  social-db:
    <<: *runtime
  catalog:
    <<: *runtime
    environment:
      TMDB_TOKEN: ${TMDB_TOKEN:?defina TMDB_TOKEN}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
  social:
    <<: *runtime
    environment:
      INVITE_ONLY: "true"
      INVITED_EMAILS: ${INVITED_EMAILS:?defina os convidados no arquivo privado}
      EMAIL_MODE: smtp
      FRONTEND_URL: ${ALPHA_URL:?defina a URL HTTPS do Funnel}
      SMTP_HOST: ${SMTP_HOST:?defina SMTP_HOST}
      SMTP_USERNAME: ${SMTP_USERNAME:?defina SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?defina SMTP_PASSWORD}
      MAIL_FROM: ${MAIL_FROM:?defina MAIL_FROM}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
  web:
    <<: *runtime
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all(['http://127.0.0.1:3000/conta','http://catalog:8181/health','http://social:8182/health'].map(u=>fetch(u,{signal:AbortSignal.timeout(3000)}).then(r=>{if(!r.ok)throw Error('unhealthy')}))).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    environment:
      NEXTAUTH_URL: ${ALPHA_URL:?defina a URL HTTPS do Funnel}
      EMAIL_ACCOUNTS: "true"
      OIDC_ISSUER: ""
      OIDC_CLIENT_ID: ""
      OIDC_CLIENT_SECRET: ""
      INVITED_SUBJECTS: ""
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}

volumes:
  admin-backups:
